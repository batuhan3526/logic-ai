stage: logic_dpo_v2
data_path: data/processed/logic_dpo/train.jsonl
eval_path: data/processed/logic_dpo/eval.jsonl
base_model_path: output/logic_sft/merged_model
output_dir: output/logic_dpo
lora:
  rank: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  dropout: 0.05
training:
  max_steps: 800
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2e-7
  max_seq_length: 2048
  max_prompt_length: 768
  max_target_length: 768
  beta: 0.4
  save_steps: 100
  eval_steps: 100
