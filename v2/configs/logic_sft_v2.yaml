stage: logic_sft_v2
data_path: data/processed/logic_sft/train.jsonl
eval_path: data/processed/logic_sft/eval.jsonl
base_model_path: /home/whiteowl/last_shot/output/dapt/merged_model
output_dir: output/logic_sft
lora:
  rank: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.1
training:
  epochs: 2
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-5
  max_seq_length: 2048
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  save_steps: 200
  eval_steps: 400
